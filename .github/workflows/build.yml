name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppMaskCalc.dylib
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc \
            -dynamiclib -framework UIKit -framework Foundation \
            -miphoneos-version-min=14.0 \
            -x objective-c Tweak.x -o AppMaskCalc.dylib
          codesign --force --sign - AppMaskCalc.dylib
          file AppMaskCalc.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppMaskCalc.dylib
          path: AppMaskCalc.dylib

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" AppMaskCalc.dylib \
            --title "AppMaskCalc build-${{ github.run_number }}" \
            --notes "TrollFools 注入用 dylib（零依赖）。下载后用 TrollFools 选择该 dylib 注入目标 app 即可。"
